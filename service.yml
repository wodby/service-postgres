name: postgres
icon: postgres
type: db
title: PostgreSQL
options:
- version: '18'
  tag: 18-r0
  eol: '2030-11-14T00:00:00+00:00'
endpoints:
- name: postgres
  ports:
  - name: postgres
    number: 5432
    protocol: tcp
scalable: false
labels:
- pgvector
- postgres
- postgresql

volumes:
- name: data
  title: Data
  size: 10
  helm:
    values:
    - name: primary.persistence.size
      value: '{{volumes.data.size}}Gi'
    - name: primary.persistence.enabled
      value: true
    # mandatory to use existing claim since this volume has import function
    # we will mount different claim after import and doing it through sts's volumeclaimtemplates is not supported
    - name: primary.persistence.existingClaim
      value: '{{volumes.data.claim}}'

database:
  type: postgres
  kind: postgres
  port: 5432
  ssl: true
  root:
    username: postgres
    password: '{{root_password}}'
  db:
    name: '{{app.name}}_{{instance.name}}'
    charset: 'UTF8'
    collation: 'en_US.utf8'
    actions:
      create:
        args:
        - make
        - create-db
        - 'name="{{database.db.name}}"'
        - 'encoding="{{database.db.charset}}"'
        - 'lc_collate="{{database.db.collation}}"'
        - 'lc_ctype="{{database.db.collation}}"'
        - 'host="{{database.host}}"'
      drop:
        args:
        - make
        - drop-db
        - 'name="{{database.db.name}}"'
        - 'host="{{database.host}}"'
  user:
    name: '{{app.name}}_{{instance.name}}'
    password: '{{password}}'
    actions:
      create:
        args:
        - make
        - create-user
        - 'username="{{database.user.name}}"'
        - 'password="{{database.user.password}}"'
        - 'host="{{database.host}}"'
      drop:
        args:
        - make
        - drop-user
        - 'username="{{database.user.name}}"'
        - 'host="{{database.host}}"'
      grant:
        args:
        - make
        - grant-user-db
        - 'username="{{database.user.name}}"'
        - 'db="{{database.db.name}}"'
        - 'host="{{database.host}}"'
      revoke:
        args:
        - make
        - revoke-user-db
        - 'username="{{database.user.name}}"'
        - 'db="{{database.db.name}}"'
        - 'host="{{database.host}}"'
  charsets:
  - name: UTF8
    title: UTF8
    collation: en_US.utf8
    default: true

imports:
- name: database
  title: Database import
  volume: data
  init:
    mount: /wodby/import
    env:
    - name: POSTGRES_DB
      value: '{{database.db.name}}'
    - name: POSTGRES_INITDB_USER
      value: '{{database.user.name}}'
    - name: POSTGRES_INITDB_PASSWORD
      value: '{{database.user.password}}'
      secret: true
  extensions:
  - gz
  - tar.gz
  - tgz
  - zip


deployment:
  strategy: rolling
  minReady: 10s
  shutdownGracePeriod: 30s

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/postgres
  chart: oci://registry-1.docker.io/wodby/postgres
  version: 0.3.2
  valueMappings:
    replicas: primary.replicaCount
    strategy: primary.updateStrategy
    minReady: primary.minReadySeconds
    shutdownGracePeriod: primary.terminationGracePeriodSeconds
  values:
  - name: primary.resourcesPreset
    value: 'none'
  - name: auth.password
    value: '{{root_password}}'

configs:
- name: config
  title: PostgreSQL config
  version: '18'
  filepath: /etc/gotpl/postgresql.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/postgresql-18.conf.tmpl

backups:
- name: database
  title: Default database backup
  options:
  - name: excluded_tables
    title: Excluded table contents
    description: PostgreSQL table patterns whose definitions are retained while 
      their rows are omitted.
    type: table_list
    defaultToken: exclude_tables
  create:
    args:
    - make
    - backup
    - 'host="{{database.host}}"'
    - 'db="{{database.db.name}}"'
    - 'ignore={{backup.options.excluded_tables}}'
    - 'filepath=/var/lib/postgresql/backup.sql.gz'
  stream:
    optionVersions:
    - '18'
    args:
    - make
    - backup-stream
    - 'host="{{database.host}}"'
    - 'db="{{database.db.name}}"'
    - 'ignore={{backup.options.excluded_tables}}'
    - 'stream_path=/var/run/wodby-backup/data'
    - 'status_path=/var/run/wodby-backup/status'
  upload:
    filepath: /var/lib/postgresql/backup.sql.gz
    extension: sql.gz

tokens:
- name: password
  generate:
    regex: '[0-9a-z-]{32}'
- name: root_password
  generate:
    regex: '[0-9a-z-]{32}'
- name: exclude_tables
  value: ''

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: statefulset
  primary: true
  helm:
    labels: commonLabels
    annotations: commonAnnotations
    volumes: primary.extraVolumes
  containers:
  - name: postgresql
    image: wodby/postgres
    helm:
      resources: primary.resources
      env: primary.extraEnvVars
      mounts: primary.extraVolumeMounts
